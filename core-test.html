
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEXCLØWN Advanced Test</title>
  <style>
    body {
      background: #090914;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #a855f7;
      color: white;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
    }
    pre {
      background: #17172a;
      padding: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>HEXCLØWN ADVANCED TEST</h2>
  <button id="run">RUN ADVANCED TEST</button>
  <pre id="output">Ready.</pre>

  <script src="botzone-core.js?v=4.0.0"></script>
  <script>
    const HEX = window["HEXCLØWN"];
    const output = document.getElementById("output");

    document.getElementById("run").onclick = async function () {
      let bot = null;
      let conversation = null;
      let message = null;
      let knowledge = null;

      const results = [];

      function pass(name) {
        results.push("PASS: " + name);
        output.textContent = results.join("\n");
      }

      function fail(name, error) {
        results.push("FAIL: " + name + " — " + error.message);
        output.textContent = results.join("\n");
      }

      output.textContent = "Starting advanced tests...";

      try {
        await HEX.requireUser();
        pass("AUTHENTICATION");

        bot = await HEX.bots.create({
          name: "HEX ADVANCED TEST BOT",
          description: "Temporary test bot"
        });
        pass("CREATE TEST BOT");

        conversation = await HEX.conversations.create(
          bot.id,
          "HEX Test Conversation"
        );
        pass("CREATE CONVERSATION");

        const foundConversation =
          await HEX.conversations.get(conversation.id);

        if (!foundConversation) {
          throw new Error("Conversation not found.");
        }
        pass("RETRIEVE CONVERSATION");

        message = await HEX.messages.save(
          conversation.id,
          "user",
          "This is a HEXCLØWN test message."
        );
        pass("SAVE MESSAGE");

        const foundMessages =
          await HEX.messages.list(conversation.id);

        if (!foundMessages.some(item => item.id === message.id)) {
          throw new Error("Saved message not found.");
        }
        pass("RETRIEVE MESSAGE");

        knowledge = await HEX.knowledge.add(
          bot.id,
          "Test Knowledge",
          "HEXCLØWN knowledge storage test."
        );
        pass("ADD KNOWLEDGE");

        const foundKnowledge =
          await HEX.knowledge.list(bot.id);

        if (!foundKnowledge.some(item => item.id === knowledge.id)) {
          throw new Error("Knowledge record not found.");
        }
        pass("RETRIEVE KNOWLEDGE");

      } catch (error) {
        fail("ADVANCED OPERATION", error);

      } finally {

        if (knowledge) {
          try {
            await HEX.knowledge.delete(knowledge.id);
            pass("DELETE TEST KNOWLEDGE");
          } catch (error) {
            fail("DELETE TEST KNOWLEDGE", error);
          }
        }

        if (message) {
          try {
            await HEX.messages.delete(message.id);
            pass("DELETE TEST MESSAGE");
          } catch (error) {
            fail("DELETE TEST MESSAGE", error);
          }
        }

        if (conversation) {
          try {
            await HEX.conversations.delete(conversation.id);
            pass("DELETE TEST CONVERSATION");
          } catch (error) {
            fail("DELETE TEST CONVERSATION", error);
          }
        }

        if (bot) {
          try {
            await HEX.bots.delete(bot.id);
            pass("CLEANUP TEST BOT");
          } catch (error) {
            fail("CLEANUP TEST BOT", error);
          }
        }

        results.push("ADVANCED TEST FINISHED");
        output.textContent = results.join("\n");
      }
    };
  </script>
</body>
</html>
