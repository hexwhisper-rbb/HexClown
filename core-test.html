
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEXCLØWN Analytics Test</title>
  <style>
    body {
      background: #090914;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #a855f7;
      color: white;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
    }
    pre {
      background: #17172a;
      padding: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>HEXCLØWN USAGE & ANALYTICS TEST</h2>
  <button id="run">RUN FINAL TEST</button>
  <pre id="output">Ready.</pre>

  <script src="botzone-core.js?v=4.0.0"></script>
  <script>
    const HEX = window["HEXCLØWN"];
    const output = document.getElementById("output");

    document.getElementById("run").onclick = async function () {
      let bot = null;
      let conversation = null;
      let usageRecord = null;
      const results = [];

      function pass(name) {
        results.push("PASS: " + name);
        output.textContent = results.join("\n");
      }

      function fail(name, error) {
        results.push("FAIL: " + name + " — " + error.message);
        output.textContent = results.join("\n");
      }

      output.textContent = "Starting final tests...";

      try {
        await HEX.requireUser();
        pass("AUTHENTICATION");

        bot = await HEX.bots.create({
          name: "HEX ANALYTICS TEST BOT",
          description: "Temporary analytics test"
        });
        pass("CREATE TEST BOT");

        conversation = await HEX.conversations.create(
          bot.id,
          "Analytics Test Conversation"
        );
        pass("CREATE TEST CONVERSATION");

        usageRecord = await HEX.usage.record({
          bot_id: bot.id,
          conversation_id: conversation.id,
          provider: "local",
          model: "test-model",
          request_type: "test",
          input_tokens: 10,
          output_tokens: 20
        });
        pass("CREATE USAGE RECORD");

        const usageRows = await HEX.usage.list(bot.id);

        if (!usageRows.some(item => item.id === usageRecord.id)) {
          throw new Error("Usage record was not retrieved.");
        }
        pass("RETRIEVE USAGE RECORD");

        const botStats = await HEX.analytics.bot(bot.id);

        if (
          botStats.requests < 1 ||
          botStats.input_tokens < 10 ||
          botStats.output_tokens < 20
        ) {
          throw new Error("Bot analytics values did not match.");
        }
        pass("BOT ANALYTICS");

        const overview = await HEX.analytics.overview();

        if (
          overview.bots < 1 ||
          overview.conversations < 1 ||
          overview.requests < 1
        ) {
          throw new Error("Overall analytics values did not match.");
        }
        pass("OVERALL ANALYTICS");

      } catch (error) {
        fail("ANALYTICS OPERATION", error);

      } finally {

        if (usageRecord) {
          try {
            await HEX.usage.delete(usageRecord.id);
            pass("DELETE TEST USAGE");
          } catch (error) {
            fail("DELETE TEST USAGE", error);
          }
        }

        if (conversation) {
          try {
            await HEX.conversations.delete(conversation.id);
            pass("CLEANUP TEST CONVERSATION");
          } catch (error) {
            fail("CLEANUP TEST CONVERSATION", error);
          }
        }

        if (bot) {
          try {
            await HEX.bots.delete(bot.id);
            pass("CLEANUP TEST BOT");
          } catch (error) {
            fail("CLEANUP TEST BOT", error);
          }
        }

        results.push("FINAL TEST FINISHED");
        output.textContent = results.join("\n");
      }
    };
  </script>
</body>
</html>
