
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEXCLØWN Auth Test</title>
  <style>
    body {
      background: #090914;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
    }
    input {
      background: #17172a;
      color: white;
      border: 1px solid #555;
    }
    button {
      background: #a855f7;
      color: white;
      border: 0;
      font-weight: bold;
    }
    pre {
      background: #17172a;
      padding: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>HEXCLØWN AUTHENTICATION TEST</h2>

  <input id="email" type="email" placeholder="Your account email">
  <input id="password" type="password" placeholder="Your password">

  <button id="login">TEST SIGN IN</button>
  <button id="session">CHECK SESSION</button>
  <button id="logout">SIGN OUT</button>

  <pre id="output">Ready.</pre>

  <script src="botzone-core.js?v=4.0.0"></script>
  <script>
    const output = document.getElementById("output");
    const HEX = window["HEXCLØWN"];

    function show(message) {
      output.textContent = message;
    }

    document.getElementById("login").onclick = async function () {
      show("Testing sign in...");

      try {
        const result = await HEX.signIn(
          document.getElementById("email").value,
          document.getElementById("password").value
        );

        show(
          "SIGN IN: PASS\n" +
          "USER ID: " + result.user.id + "\n" +
          "SESSION: " + !!result.session
        );
      } catch (error) {
        show("SIGN IN: FAIL\n" + error.message);
      }
    };

    document.getElementById("session").onclick = async function () {
      show("Checking session...");

      try {
        const session = await HEX.getSession();

        show(
          session
            ? "SESSION: ACTIVE\nUSER ID: " + session.user.id
            : "SESSION: NOT FOUND"
        );
      } catch (error) {
        show("SESSION ERROR:\n" + error.message);
      }
    };

    document.getElementById("logout").onclick = async function () {
      try {
        await HEX.signOut();
        show("SIGN OUT: PASS");
      } catch (error) {
        show("SIGN OUT: FAIL\n" + error.message);
      }
    };
  </script>
</body>
</html>
