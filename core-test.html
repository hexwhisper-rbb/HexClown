
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEXCLØWN Bot Test</title>
  <style>
    body {
      background: #090914;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #a855f7;
      color: white;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
    }
    pre {
      background: #17172a;
      padding: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>HEXCLØWN BOT DATABASE TEST</h2>
  <button id="run">RUN BOT TEST</button>
  <pre id="output">Ready.</pre>

  <script src="botzone-core.js?v=4.0.0"></script>
  <script>
    const HEX = window["HEXCLØWN"];
    const output = document.getElementById("output");

    document.getElementById("run").onclick = async function () {
      let testBot = null;
      const results = [];

      function pass(message) {
        results.push("PASS: " + message);
        output.textContent = results.join("\n");
      }

      function fail(message, error) {
        results.push("FAIL: " + message + " — " + error.message);
        output.textContent = results.join("\n");
      }

      output.textContent = "Starting bot tests...";

      try {
        await HEX.requireUser();
        pass("AUTHENTICATION");

        testBot = await HEX.bots.create({
          name: "HEX TEST BOT",
          description: "Temporary diagnostic bot",
          category: "Testing"
        });
        pass("CREATE BOT");

        const found = await HEX.bots.get(testBot.id);

        if (!found) throw new Error("Created bot could not be retrieved.");
        pass("RETRIEVE BOT");

        await HEX.bots.update(testBot.id, {
          description: "Updated diagnostic bot"
        });
        pass("UPDATE BOT");

        const updated = await HEX.bots.get(testBot.id);

        if (updated.description !== "Updated diagnostic bot") {
          throw new Error("Updated description did not match.");
        }
        pass("VERIFY UPDATE");

        const list = await HEX.bots.list();

        if (!list.some(bot => bot.id === testBot.id)) {
          throw new Error("Test bot was not found in bot list.");
        }
        pass("LIST BOTS");

      } catch (error) {
        fail("BOT OPERATION", error);

      } finally {
        if (testBot) {
          try {
            const deleted = await HEX.bots.delete(testBot.id);

            if (deleted.deleted === 1) {
              pass("CLEANUP TEST BOT");
            } else {
              results.push("CHECK: Test bot may still exist.");
            }
          } catch (error) {
            fail("CLEANUP TEST BOT", error);
          }
        }

        results.push("BOT TEST FINISHED");
        output.textContent = results.join("\n");
      }
    };
  </script>
</body>
</html>
