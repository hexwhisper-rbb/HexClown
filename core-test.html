
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEXCLØWN Core Test</title>
  <style>
    body {
      background: #090914;
      color: #e9e9ff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2 { color: #bd65ff; }
    pre {
      background: #17172a;
      border: 1px solid #454064;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>HEXCLØWN CORE DIAGNOSTIC</h2>
  <p>Checking your Bot Zone core...</p>
  <pre id="results">Starting test...</pre>

  <script src="botzone-core.js?v=4.0.0"></script>
  <script>
    const output = document.getElementById("results");

    function report(message) {
      output.textContent += "\n" + message;
    }

    output.textContent = "CORE GLOBAL: " +
      (window["HEXCLØWN"] ? "PASS" : "FAIL");

    report("HEX GLOBAL: " +
      (window.HEX ? "PASS" : "FAIL"));

    const HEX = window["HEXCLØWN"];

    if (HEX) {
      report("CORE VERSION: " + HEX.version);
      report("getSession: " +
        (typeof HEX.getSession === "function" ? "PASS" : "FAIL"));
      report("signIn: " +
        (typeof HEX.signIn === "function" ? "PASS" : "FAIL"));
      report("signOut: " +
        (typeof HEX.signOut === "function" ? "PASS" : "FAIL"));
      report("initialize: " +
        (typeof HEX.initialize === "function" ? "PASS" : "FAIL"));
      report("bots.list: " +
        (typeof HEX.bots?.list === "function" ? "PASS" : "FAIL"));
      report("conversations.list: " +
        (typeof HEX.conversations?.list === "function" ? "PASS" : "FAIL"));
      report("messages.save: " +
        (typeof HEX.messages?.save === "function" ? "PASS" : "FAIL"));
      report("knowledge.add: " +
        (typeof HEX.knowledge?.add === "function" ? "PASS" : "FAIL"));
      report("analytics.overview: " +
        (typeof HEX.analytics?.overview === "function" ? "PASS" : "FAIL"));
    }
  </script>
</body>
</html>
