
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090713">
<title>My Bots | HEXCLØWN</title>

<style>
:root {
  --bg: #090713;
  --panel: #121020;
  --panel2: #19152b;
  --purple: #a855f7;
  --pink: #ec4899;
  --blue: #3b82f6;
  --cyan: #22d3ee;
  --green: #a3e635;
  --gold: #fbbf24;
  --text: #f5f3ff;
  --muted: #9690aa;
  --border: rgba(168,85,247,.22);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 10% 0%, #291044 0, transparent 32%),
    radial-gradient(circle at 95% 20%, #10284b 0, transparent 30%),
    var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.topbar {
  min-height: 66px;
  padding: 15px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  border-bottom: 1px solid var(--border);
  background: rgba(9,7,19,.88);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(14px);
}

.brand {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 1px;
  color: white;
}

.brand span {
  color: var(--purple);
  text-shadow: 0 0 15px var(--purple);
}

.top-actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}

.btn {
  border: 1px solid var(--border);
  color: white;
  background: var(--panel2);
  padding: 10px 14px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: bold;
}

.btn:hover {
  border-color: var(--cyan);
}

.btn-primary {
  background: linear-gradient(110deg, #9333ea, #db2777);
  border: 0;
}

.container {
  width: min(1120px, 92%);
  margin: auto;
  padding: 30px 0 60px;
}

.hero {
  padding: 25px 0;
}

.eyebrow {
  color: var(--green);
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: bold;
}

.hero h1 {
  font-size: clamp(29px, 6vw, 48px);
  margin: 12px 0;
  letter-spacing: -1.5px;
}

.hero h1 span {
  background: linear-gradient(90deg, var(--purple), var(--pink), var(--cyan));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero p {
  color: var(--muted);
  max-width: 580px;
  line-height: 1.7;
  font-size: 14px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 13px;
  margin: 25px 0 30px;
}

.stat {
  background: linear-gradient(145deg, #19142a, #100e1d);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 18px;
  min-width: 0;
}

.stat-label {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 27px;
  font-weight: 900;
  margin-top: 10px;
}

.stat:nth-child(1) .stat-value { color: var(--purple); }
.stat:nth-child(2) .stat-value { color: var(--cyan); }
.stat:nth-child(3) .stat-value { color: var(--green); }
.stat:nth-child(4) .stat-value { color: var(--pink); }

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 28px 0 17px;
  flex-wrap: wrap;
}

.section-heading h2 {
  font-size: 19px;
  margin: 0;
}

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.search {
  flex: 1;
  min-width: 180px;
  background: #151225;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 13px;
  color: white;
  outline: none;
}

.search:focus {
  border-color: var(--cyan);
}

.filter {
  background: #151225;
  border: 1px solid var(--border);
  color: white;
  border-radius: 9px;
  padding: 12px;
  min-width: 125px;
}

.bot-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.bot-card {
  background: linear-gradient(145deg, #19152a, #100e1b);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 17px;
  min-width: 0;
  transition: .2s ease;
  position: relative;
  overflow: hidden;
}

.bot-card:hover {
  transform: translateY(-3px);
  border-color: var(--purple);
  box-shadow: 0 8px 30px rgba(168,85,247,.12);
}

.bot-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.bot-icon {
  width: 48px;
  height: 48px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-size: 24px;
  background: #28203d;
  border: 1px solid #49336b;
}

.bot-name {
  font-size: 17px;
  font-weight: bold;
  margin: 15px 0 7px;
  overflow-wrap: anywhere;
}

.bot-description {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  min-height: 39px;
  overflow-wrap: anywhere;
}

.bot-meta {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin: 14px 0;
}

.tag {
  font-size: 10px;
  padding: 6px 8px;
  border-radius: 20px;
  background: #211a32;
  color: var(--cyan);
  border: 1px solid rgba(34,211,238,.2);
}

.tag.off {
  color: var(--pink);
}

.tag.on {
  color: var(--green);
}

.bot-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  border-top: 1px solid var(--border);
  padding-top: 13px;
}

.bot-actions button {
  flex: 1;
  min-width: 65px;
  padding: 9px 7px;
  font-size: 11px;
}

.empty-state, .loading-state {
  text-align: center;
  padding: 45px 15px;
  background: rgba(20,16,34,.8);
  border: 1px dashed #49336b;
  border-radius: 15px;
  color: var(--muted);
  line-height: 1.7;
}

.empty-state .symbol {
  font-size: 38px;
  margin-bottom: 12px;
}

.message {
  padding: 12px;
  border-radius: 9px;
  margin: 15px 0;
  font-size: 13px;
  display: none;
  overflow-wrap: anywhere;
}

.message.error {
  display: block;
  color: #fda4af;
  background: #351323;
  border: 1px solid #9f3156;
}

.message.success {
  display: block;
  color: var(--green);
  background: #17251a;
  border: 1px solid #426b34;
}

.footer {
  border-top: 1px solid var(--border);
  padding: 22px 5%;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 1px;
}

@media(max-width: 800px) {
  .bot-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width: 520px) {
  .container {
    width: 92%;
    padding-top: 20px;
  }

  .topbar {
    padding: 13px 4%;
  }

  .brand {
    font-size: 16px;
  }

  .top-actions .btn {
    padding: 9px;
    font-size: 10px;
  }

  .bot-grid {
    grid-template-columns: 1fr;
  }

  .stat {
    padding: 14px;
  }

  .stat-value {
    font-size: 23px;
  }

  .hero h1 {
    font-size: 32px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">HEX<span>CLØWN</span></div>

  <div class="top-actions">
    <button class="btn" onclick="location.href='whisperbots.html'">
      DASHBOARD
    </button>

    <button class="btn btn-primary"
      onclick="location.href='createbot.html'">
      + CREATE BOT
    </button>
  </div>
</header>

<main class="container">

  <section class="hero">
    <div class="eyebrow">BOT ZONE / CONTROL CENTER</div>

    <h1>MY <span>BOTS</span></h1>

    <p>
      Your personal bot collection. Manage your creations,
      customize their behaviour, and explore your Bot Zone.
    </p>
  </section>

  <section class="stats">
    <div class="stat">
      <div class="stat-label">Total Bots</div>
      <div class="stat-value" id="totalBots">—</div>
    </div>

    <div class="stat">
      <div class="stat-label">Active Bots</div>
      <div class="stat-value" id="activeBots">—</div>
    </div>

    <div class="stat">
      <div class="stat-label">Favorites</div>
      <div class="stat-value" id="favoriteBots">—</div>
    </div>

    <div class="stat">
      <div class="stat-label">Inactive Bots</div>
      <div class="stat-value" id="inactiveBots">—</div>
    </div>
  </section>

  <div id="message" class="message"></div>

  <section>
    <div class="section-heading">
      <h2>YOUR COLLECTION</h2>

      <button class="btn btn-primary"
        onclick="location.href='createbot.html'">
        + NEW BOT
      </button>
    </div>

    <div class="toolbar">
      <input
        class="search"
        id="searchBots"
        type="search"
        placeholder="Search your bots..."
        autocomplete="off"
      >

      <select class="filter" id="filterBots">
        <option value="all">All bots</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="favorite">Favorites</option>
      </select>
    </div>

    <div id="botGrid" class="bot-grid">
      <div class="loading-state">
        INITIALIZING BOT DATABASE...
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  HEXCLØWN BOT ZONE · CONTROL YOUR CREATIONS
</footer>
  <script src="./botzone-core.js?v=4.1.0"></script>

<script>
(function () {
  "use strict";

  const HEX = window["HEXCLØWN"] || window.HEX;

  const botGrid = document.getElementById("botGrid");
  const messageBox = document.getElementById("message");
  const searchInput = document.getElementById("searchBots");
  const filterSelect = document.getElementById("filterBots");

  let allBots = [];
  let busy = false;

  // =====================================
  // MESSAGE DISPLAY
  // =====================================

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message " + type;

    window.setTimeout(function () {
      messageBox.className = "message";
    }, 4000);
  }

  // =====================================
  // HTML SAFETY
  // =====================================

  function escapeHTML(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // =====================================
  // UPDATE STATISTICS
  // =====================================

  function updateStats() {
    const total = allBots.length;

    const active = allBots.filter(function (bot) {
      return bot.active === true;
    }).length;

    const favorite = allBots.filter(function (bot) {
      return bot.favorite === true;
    }).length;

    document.getElementById("totalBots").textContent = total;

    document.getElementById("activeBots").textContent = active;

    document.getElementById("favoriteBots").textContent = favorite;

    document.getElementById("inactiveBots").textContent =
      total - active;
  }

  // =====================================
  // RENDER BOT CARDS
  // =====================================

  function renderBots() {
    const search = searchInput.value.trim().toLowerCase();
    const filter = filterSelect.value;

    let filtered = allBots.filter(function (bot) {
      const name = String(bot.name || "").toLowerCase();
      const description = String(
        bot.description || ""
      ).toLowerCase();

      const matchesSearch =
        name.includes(search) ||
        description.includes(search);

      let matchesFilter = true;

      if (filter === "active") {
        matchesFilter = bot.active === true;
      }

      if (filter === "inactive") {
        matchesFilter = bot.active !== true;
      }

      if (filter === "favorite") {
        matchesFilter = bot.favorite === true;
      }

      return matchesSearch && matchesFilter;
    });

    if (!filtered.length) {
      botGrid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="symbol">◈</div>
          <strong>NO BOTS FOUND</strong>
          <p>
            ${
              allBots.length
                ? "Try another search or filter."
                : "Your collection is empty. Create your first bot to get started."
            }
          </p>
          ${
            allBots.length
              ? ""
              : `<button class="btn btn-primary"
                  onclick="location.href='createbot.html'">
                  CREATE YOUR FIRST BOT
                </button>`
          }
        </div>
      `;
      return;
    }

    botGrid.innerHTML = filtered.map(function (bot) {
      const id = escapeHTML(bot.id);
      const name = escapeHTML(bot.name || "Untitled Bot");
      const description = escapeHTML(
        bot.description || "No description added."
      );

      const icon = escapeHTML(bot.icon || "🤖");
      const category = escapeHTML(bot.category || "General");

      const active = bot.active === true;
      const favorite = bot.favorite === true;

      return `
        <article class="bot-card">

          <div class="bot-top">
            <div class="bot-icon">${icon}</div>

            <button
              class="btn"
              data-action="favorite"
              data-id="${id}"
              title="Toggle favorite"
            >
              ${favorite ? "★" : "☆"}
            </button>
          </div>

          <div class="bot-name">${name}</div>

          <div class="bot-description">${description}</div>

          <div class="bot-meta">
            <span class="tag">${category}</span>

            <span class="tag ${active ? "on" : "off"}">
              ${active ? "ACTIVE" : "INACTIVE"}
            </span>

            <span class="tag">
              ${favorite ? "FAVORITE" : "STANDARD"}
            </span>
          </div>

          <div class="bot-actions">

            <button
              class="btn btn-primary"
              data-action="open"
              data-id="${id}"
            >
              OPEN
            </button>

            <button
              class="btn"
              data-action="edit"
              data-id="${id}"
            >
              EDIT
            </button>

            <button
              class="btn"
              data-action="toggle"
              data-id="${id}"
            >
              ${active ? "PAUSE" : "ACTIVATE"}
            </button>

            <button
              class="btn"
              data-action="delete"
              data-id="${id}"
            >
              DELETE
            </button>

          </div>
        </article>
      `;
    }).join("");
  }

  // =====================================
  // LOAD BOTS
  // =====================================

  async function loadBots() {
    if (!HEX) {
      botGrid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          HEXCLØWN CORE NOT FOUND.
          <p>Check that botzone-core.js is in the same folder.</p>
        </div>
      `;
      return;
    }

    try {
      botGrid.innerHTML = `
        <div class="loading-state" style="grid-column:1/-1">
          CONNECTING TO BOT DATABASE...
        </div>
      `;

      await HEX.initialize();

      const user = await HEX.getUser();

      if (!user) {
        location.replace("whisperbots.html");
        return;
      }

      allBots = await HEX.bots.list();

      updateStats();
      renderBots();

    } catch (error) {
      console.error("Bot loading error:", error);

      botGrid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <strong>COULD NOT LOAD YOUR BOTS</strong>
          <p>${escapeHTML(error.message)}</p>
          <button class="btn" id="retryLoad">RETRY</button>
        </div>
      `;
    }
  }

  // =====================================
  // BOT ACTIONS
  // =====================================

  async function handleAction(action, id) {
    if (busy) return;

    const bot = allBots.find(function (item) {
      return item.id === id;
    });

    if (!bot) {
      showMessage("Bot not found.", "error");
      return;
    }

    if (action === "open") {
      location.href =
        "botplayground.html?bot=" + encodeURIComponent(id);
      return;
    }

    if (action === "edit") {
      location.href =
        "personalityeditor.html?bot=" + encodeURIComponent(id);
      return;
    }

    if (action === "delete") {
      const confirmed = window.confirm(
        'Delete "' + bot.name + '"? This action cannot be undone.'
      );

      if (!confirmed) return;
    }

    busy = true;

    try {
      if (action === "favorite") {
        await HEX.bots.toggleFavorite(id);
        showMessage("Favorite status updated.", "success");
      }

      else if (action === "toggle") {
        await HEX.bots.toggleActive(id);
        showMessage("Bot status updated.", "success");
      }

      else if (action === "delete") {
        await HEX.bots.delete(id);
        showMessage("Bot deleted.", "success");
      }

      await loadBots();

    } catch (error) {
      console.error("Bot action error:", error);
      showMessage(error.message || "Action failed.", "error");

    } finally {
      busy = false;
    }
  }

  // =====================================
  // EVENT LISTENERS
  // =====================================

  searchInput.addEventListener("input", renderBots);

  filterSelect.addEventListener("change", renderBots);

  botGrid.addEventListener("click", function (event) {
    const button = event.target.closest("[data-action]");

    if (!button) {
      if (event.target.id === "retryLoad") {
        loadBots();
      }
      return;
    }

    const action = button.dataset.action;
    const id = button.dataset.id;

    handleAction(action, id);
  });

  // =====================================
  // START
  // =====================================

  loadBots();

})();
              </script>
</body>
</html>
