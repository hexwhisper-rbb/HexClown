
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEXCLØWN Backend Test</title>
  <style>
    body {
      background: #080d12;
      color: #e8f5f5;
      font-family: Arial, sans-serif;
      padding: 25px;
    }
    h2 { color: #00e5c3; }
    button {
      background: #00bfa5;
      color: #001410;
      border: 0;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: #121e26;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

  <h2>HEXCLØWN</h2>
  <p>Bot Zone Backend Diagnostics</p>

  <button onclick="runTests()">RUN BACKEND TEST</button>

  <div id="result">Waiting for test...</div>

  

<script src="./botzone-core.js"></script>

<script>
async function runTests() {
  const output = document.getElementById("result");

  let testBot = null;
  let report = [];

  output.textContent = "Starting bot database tests...";

  try {
    await window.HEXCLØWN.ready();

    // Check authentication
    const user = await window.HEXCLØWN.auth.getUser();

    if (!user) {
      throw new Error("Please sign in first.");
    }

    report.push("AUTHENTICATION: PASS");

    // CREATE
    testBot = await window.HEXCLØWN.bots.create({
      name: "HEXCLØWN Temporary Test Bot",
      description: "Temporary database test. Safe to delete.",
      category: "Testing",
      icon: "🧪",
      visibility: "private",
      personality: "Helpful",
      response_style: "Friendly",
      active: true,
      favorite: false,
      settings: {
        temporary_test: true
      }
    });

    report.push("CREATE BOT: PASS");

    // RETRIEVE
    const foundBot =
      await window.HEXCLØWN.bots.get(testBot.id);

    if (!foundBot) {
      throw new Error("Created bot could not be retrieved.");
    }

    report.push("RETRIEVE BOT: PASS");

    // UPDATE
    const updatedBot =
      await window.HEXCLØWN.bots.update(testBot.id, {
        description: "Updated successfully during database test."
      });

    if (
      updatedBot.description !==
      "Updated successfully during database test."
    ) {
      throw new Error("Bot update verification failed.");
    }

    report.push("UPDATE BOT: PASS");

  } catch (error) {
    report.push("ERROR: " + error.message);

  } finally {

    // DELETE ONLY THE TEMPORARY BOT CREATED ABOVE
    if (testBot && testBot.id) {
      try {
        await window.HEXCLØWN.bots.delete(testBot.id);
        report.push("DELETE TEST BOT: PASS");
      } catch (error) {
        report.push(
          "DELETE TEST BOT: FAILED - " + error.message
        );
      }
    } else {
      report.push("DELETE TEST BOT: NOT NEEDED");
    }

    output.textContent = report.join("\n\n");
  }
}
</script>
  
  

</body>
</html>
