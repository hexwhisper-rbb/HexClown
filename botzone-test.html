
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEXCLØWN Backend Test</title>
  <style>
    body {
      background: #080d12;
      color: #e8f5f5;
      font-family: Arial, sans-serif;
      padding: 25px;
    }
    h2 { color: #00e5c3; }
    button {
      background: #00bfa5;
      color: #001410;
      border: 0;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: #121e26;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

  <h2>HEXCLØWN</h2>
  <p>Bot Zone Backend Diagnostics</p>

  <button onclick="runTests()">RUN BACKEND TEST</button>

  <div id="result">Waiting for test...</div>

  

<script src="./botzone-core.js"></script>

<script>
async function runTests() {
  const output = document.getElementById("result");

  let testBot = null;
  let testKnowledge = null;
  let report = [];

  output.textContent = "Starting knowledge tests...";

  try {
    await window.HEXCLØWN.ready();

    const user = await window.HEXCLØWN.auth.getUser();

    if (!user) throw new Error("Please sign in first.");

    report.push("AUTHENTICATION: PASS");

    testBot = await window.HEXCLØWN.bots.create({
      name: "HEXCLØWN Knowledge Test Bot",
      description: "Temporary knowledge test",
      category: "Testing",
      visibility: "private",
      active: true
    });

    report.push("CREATE TEST BOT: PASS");

    testKnowledge = await window.HEXCLØWN.knowledge.add(
      testBot.id,
      {
        title: "HEXCLØWN Test Knowledge",
        content: "This is temporary test information.",
        source_type: "manual",
        metadata: {
          temporary_test: true
        }
      }
    );

    if (!testKnowledge || !testKnowledge.id) {
      throw new Error("Knowledge creation failed.");
    }

    report.push("ADD KNOWLEDGE: PASS");

    const items =
      await window.HEXCLØWN.knowledge.list(testBot.id);

    const found = items.find(
      item => item.id === testKnowledge.id
    );

    if (!found) {
      throw new Error("Knowledge retrieval failed.");
    }

    report.push("RETRIEVE KNOWLEDGE: PASS");    await window.HEXCLØWN.knowledge.delete(
      testKnowledge.id
    );

    report.push("DELETE KNOWLEDGE: PASS");

    const remaining =
      await window.HEXCLØWN.knowledge.list(testBot.id);

    if (remaining.some(item => item.id === testKnowledge.id)) {
      throw new Error("Deleted knowledge still exists.");
    }

    report.push("VERIFY DELETION: PASS");

  } catch (error) {
    report.push("ERROR: " + error.message);

  } finally {

    if (testKnowledge && testKnowledge.id) {
      try {
        const remaining =
          await window.HEXCLØWN.knowledge.list(testBot.id);

        for (const item of remaining) {
          if (item.id === testKnowledge.id) {
            await window.HEXCLØWN.knowledge.delete(item.id);
          }
        }
      } catch (error) {
        report.push("KNOWLEDGE CLEANUP: FAILED - " + error.message);
      }
    }

    if (testBot && testBot.id) {
      try {
        await window.HEXCLØWN.bots.delete(testBot.id);
        report.push("CLEANUP TEST BOT: PASS");

      } catch (error) {
        report.push("CLEANUP TEST BOT: FAILED - " + error.message);
      }
    }

    output.textContent = report.join("\n\n");
  }
}
</script>

</body>
</html>
