
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEXCLØWN Backend Test</title>
  <style>
    body {
      background: #080d12;
      color: #e8f5f5;
      font-family: Arial, sans-serif;
      padding: 25px;
    }
    h2 { color: #00e5c3; }
    button {
      background: #00bfa5;
      color: #001410;
      border: 0;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: #121e26;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

  <h2>HEXCLØWN</h2>
  <p>Bot Zone Backend Diagnostics</p>

  <button onclick="runTests()">RUN BACKEND TEST</button>

  <div id="result">Waiting for test...</div>

  

<script src="./botzone-core.js"></script>

<script>
async function runTests() {
  const output = document.getElementById("result");
  let testBot = null;
  let testConversation = null;
  let testMessage = null;
  let report = [];

  output.textContent = "Running conversation tests...";

  try {
    await window.HEXCLØWN.ready();

    const user = await window.HEXCLØWN.auth.getUser();
    if (!user) throw new Error("Please sign in first.");

    report.push("AUTHENTICATION: PASS");

    testBot = await window.HEXCLØWN.bots.create({
      name: "HEXCLØWN Conversation Test Bot",
      description: "Temporary test bot",
      category: "Testing",
      visibility: "private",
      active: true
    });

    report.push("CREATE TEST BOT: PASS");

    testConversation = await window.HEXCLØWN.conversations.create({
      bot_id: testBot.id,
      title: "HEXCLØWN Test Conversation"
    });

    if (!testConversation || !testConversation.id) {
      throw new Error("Conversation creation failed.");
    }

    report.push("CREATE CONVERSATION: PASS");

    const conversations =
      await window.HEXCLØWN.conversations.list(testBot.id);

    const foundConversation = conversations.find(
      item => item.id === testConversation.id
    );

    if (!foundConversation) {
      throw new Error("Conversation retrieval failed.");
    }

    report.push("RETRIEVE CONVERSATION: PASS");

        testMessage = await window.HEXCLØWN.messages.save(
      testConversation.id,
      "user",
      "Hello HEXCLØWN. This is a backend test."
    );

    if (!testMessage || !testMessage.id) {
      throw new Error("Message saving failed.");
    }

    report.push("SAVE MESSAGE: PASS");

    const messages =
      await window.HEXCLØWN.messages.list(testConversation.id);

    const foundMessage = messages.find(
      item => item.id === testMessage.id
    );

    if (!foundMessage) {
      throw new Error("Message retrieval failed.");
    }

    report.push("RETRIEVE MESSAGE: PASS");

  } catch (error) {
    report.push("ERROR: " + error.message);

  } finally {
    if (testConversation && testConversation.id) {
      try {
        const messages =
          await window.HEXCLØWN.messages.list(testConversation.id);

        for (const message of messages) {
          await window.HEXCLØWN.messages.delete(message.id);
        }

        await window.HEXCLØWN.conversations.delete(
          testConversation.id
        );

        report.push("CLEANUP CONVERSATION: PASS");

      } catch (error) {
        report.push("CLEANUP CONVERSATION: FAILED - " + error.message);
      }
    }

    if (testBot && testBot.id) {
      try {
        await window.HEXCLØWN.bots.delete(testBot.id);
        report.push("CLEANUP TEST BOT: PASS");

      } catch (error) {
        report.push("CLEANUP TEST BOT: FAILED - " + error.message);
      }
    }

    output.textContent = report.join("\n\n");
  }
}
</script>

</body>
</html>
