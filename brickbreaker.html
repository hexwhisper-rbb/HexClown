
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071321">
<title>Brick Breaker | HEXCLØWN</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #071321;
    color: #eaffff;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #00ffc8;
    text-shadow: 0 0 12px #00ffc8;
    margin: 10px 0;
}

.subtitle {
    color: #9bbbc8;
    font-size: 14px;
}

.game-box {
    max-width: 520px;
    margin: 20px auto;
    padding: 12px;
    background: #102438;
    border: 1px solid #00d9ff;
    border-radius: 15px;
    box-shadow: 0 0 20px #00d9ff33;
}

.stats {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

.stat {
    color: #00ffc8;
    font-weight: bold;
    font-size: 14px;
}

canvas {
    display: block;
    width: 100%;
    max-width: 480px;
    height: auto;
    margin: auto;
    background: #030b14;
    border: 2px solid #00d9ff;
    border-radius: 8px;
    touch-action: none;
}

button {
    border: none;
    padding: 12px 18px;
    margin: 6px 3px;
    border-radius: 8px;
    background: #00d9ff;
    color: #061321;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

button:active {
    background: #00ffc8;
    transform: scale(.97);
}

#startBtn {
    background: #00ffc8;
}

.controls {
    margin-top: 12px;
}

.info {
    color: #a9c5d0;
    font-size: 13px;
    line-height: 1.6;
}

.back {
    display: inline-block;
    margin-top: 15px;
    color: #00ffc8;
    text-decoration: none;
    border: 1px solid #00ffc8;
    padding: 10px 18px;
    border-radius: 8px;
}
</style>
</head>

<body>

<h1>BRICK BREAKER</h1>
<p class="subtitle">HEXCLØWN ARCADE SYSTEM</p>

<div class="game-box">

    <div class="stats">
        <div class="stat">SCORE: <span id="score">0</span></div>
        <div class="stat">LIVES: <span id="lives">3</span></div>
        <div class="stat">LEVEL: <span id="level">1</span></div>
    </div>

    <canvas id="game" width="480" height="640"></canvas>

    <div class="controls">
        <button id="startBtn">START GAME</button>
        <button id="pauseBtn">PAUSE</button>
        <button id="restartBtn">RESTART</button>
    </div>

    <p class="info">
        Move the paddle with your finger or mouse.<br>
        You can also use the LEFT and RIGHT arrow keys.<br>
        Break all the bricks without losing the ball!
    </p>

</div>

<a class="back" href="arcandact.html">← BACK TO ARCADE & ACTION</a>

<script>
(function () {

"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");
const levelText = document.getElementById("level");

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const restartBtn = document.getElementById("restartBtn");

if (!ctx) {
    document.body.innerHTML = "<h2>Your browser could not start the game canvas.</h2>";
    return;
}

const W = canvas.width;
const H = canvas.height;

let score = 0;
let lives = 3;
let level = 1;

let state = "ready";
let animationId = null;

let leftPressed = false;
let rightPressed = false;

const paddle = {
    x: 190,
    y: 590,
    w: 100,
    h: 13,
    speed: 7
};

const ball = {
    x: W / 2,
    y: 570,
    r: 8,
    dx: 3,
    dy: -4
};

let bricks = [];

const brickRows = 5;
const brickCols = 8;
const brickWidth = 48;
const brickHeight = 18;
const brickGap = 8;
const brickStartX = 24;
const brickStartY = 75;

const brickColors = [
    "#00ffc8",
    "#00d9ff",
    "#3985ff",
    "#a855f7",
    "#ff4568"
];

function saveBest(value) {
    try {
        const oldBest = Number(localStorage.getItem("hexclownBrickBest")) || 0;
        if (value > oldBest) {
            localStorage.setItem("hexclownBrickBest", String(value));
        }
    } catch (error) {
        // The game still works if storage is unavailable.
    }
}

function createBricks() {
    bricks = [];

    for (let row = 0; row < brickRows; row++) {
        for (let col = 0; col < brickCols; col++) {
            bricks.push({
                x: brickStartX + col * (brickWidth + brickGap),
                y: brickStartY + row * (brickHeight + brickGap),
                w: brickWidth,
                h: brickHeight,
                color: brickColors[row],
                alive: true
            });
        }
    }
}

function updateStats() {
    scoreText.textContent = score;
    livesText.textContent = lives;
    levelText.textContent = level;
}

function resetBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 2;

    ball.dx = 3 + (level - 1) * 0.3;
    ball.dy = -4 - (level - 1) * 0.3;
}

function resetGame() {
    score = 0;
    lives = 3;
    level = 1;

    paddle.x = (W - paddle.w) / 2;

    createBricks();
    resetBall();
    updateStats();

    state = "ready";
    startBtn.textContent = "START GAME";
    draw();
}

function startGame() {
    if (state === "gameover" || state === "won") {
        resetGame();
    }

    if (state === "ready") {
        state = "running";
    } else if (state === "paused") {
        state = "running";
    }

    startBtn.textContent = "GAME RUNNING";
    draw();
}

function pauseGame() {
    if (state === "running") {
        state = "paused";
        startBtn.textContent = "RESUME GAME";
    } else if (state === "paused") {
        startGame();
    }

    draw();
}

function movePaddle() {
    if (leftPressed) {
        paddle.x -= paddle.speed;
    }

    if (rightPressed) {
        paddle.x += paddle.speed;
    }

    if (paddle.x < 0) {
        paddle.x = 0;
    }

    if (paddle.x + paddle.w > W) {
        paddle.x = W - paddle.w;
    }
}

function updateBall() {
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Left and right walls
    if (ball.x - ball.r < 0) {
        ball.x = ball.r;
        ball.dx = Math.abs(ball.dx);
    }

    if (ball.x + ball.r > W) {
        ball.x = W - ball.r;
        ball.dx = -Math.abs(ball.dx);
    }

    // Top wall
    if (ball.y - ball.r < 0) {
        ball.y = ball.r;
        ball.dy = Math.abs(ball.dy);
    }

    // Paddle collision
    if (
        ball.dy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.w
    ) {
        ball.y = paddle.y - ball.r;

        const hitPosition =
            (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);

        ball.dx = hitPosition * 5;
        ball.dy = -Math.abs(ball.dy);
    }

    // Brick collision
    for (let i = 0; i < bricks.length; i++) {
        const brick = bricks[i];

        if (!brick.alive) continue;

        if (
            ball.x + ball.r > brick.x &&
            ball.x - ball.r < brick.x + brick.w &&
            ball.y + ball.r > brick.y &&
            ball.y - ball.r < brick.y + brick.h
        ) {
            brick.alive = false;
            ball.dy *= -1;

            score += 10;
            updateStats();
            break;
        }
    }

    // Ball lost
    if (ball.y - ball.r > H) {
        lives--;
        updateStats();

        if (lives <= 0) {
            state = "gameover";
            startBtn.textContent = "PLAY AGAIN";
        } else {
            resetBall();
            state = "ready";
            startBtn.textContent = "CONTINUE";
        }
    }

    // Check if all bricks are cleared
    let remaining = 0;

    for (let i = 0; i < bricks.length; i++) {
        if (bricks[i].alive) remaining++;
    }

    if (remaining === 0) {
        level++;

        if (level > 5) {
            state = "won";
            startBtn.textContent = "PLAY AGAIN";
        } else {
            createBricks();
            resetBall();
            state = "ready";
            startBtn.textContent = "NEXT LEVEL";
        }

        updateStats();
    }
}

function drawBricks() {
    for (let i = 0; i < bricks.length; i++) {
        const brick = bricks[i];

        if (!brick.alive) continue;

        ctx.fillStyle = brick.color;
        ctx.shadowColor = brick.color;
        ctx.shadowBlur = 8;

        ctx.fillRect(
            brick.x,
            brick.y,
            brick.w,
            brick.h
        );

        ctx.shadowBlur = 0;
    }
}

function drawPaddle() {
    ctx.fillStyle = "#00ffc8";
    ctx.shadowColor = "#00ffc8";
    ctx.shadowBlur = 15;

    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.w,
        paddle.h
    );

    ctx.shadowBlur = 0;
}

function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);

    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#00d9ff";
    ctx.shadowBlur = 18;

    ctx.fill();

    ctx.shadowBlur = 0;
}

function drawOverlay(title, message) {
    ctx.fillStyle = "rgba(0, 5, 15, 0.82)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";

    ctx.fillStyle = "#00ffc8";
    ctx.font = "bold 32px Arial";
    ctx.fillText(title, W / 2, 280);

    ctx.fillStyle = "#ffffff";
    ctx.font = "16px Arial";
    ctx.fillText(message, W / 2, 320);
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = "#030b14";
    ctx.fillRect(0, 0, W, H);

    // Decorative lines
    ctx.strokeStyle = "#102638";
    ctx.lineWidth = 1;

    for (let y = 0; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }

    drawBricks();
    drawPaddle();
    drawBall();

    if (state === "ready") {
        drawOverlay("BRICK BREAKER", "Tap START GAME to play");
    }

    if (state === "paused") {
        drawOverlay("PAUSED", "Tap RESUME GAME to continue");
    }

    if (state === "gameover") {
        drawOverlay("GAME OVER", "Tap PLAY AGAIN to restart");
    }

    if (state === "won") {
        drawOverlay("YOU WIN!", "You cleared all five levels!");
    }
}

function gameLoop() {
    if (state === "running") {
        movePaddle();
        updateBall();
    }

    draw();

    animationId = requestAnimationFrame(gameLoop);
}

// Mouse and touch movement
function moveToPointer(event) {
    const rect = canvas.getBoundingClientRect();

    const scaleX = W / rect.width;
    const pointerX = (event.clientX - rect.left) * scaleX;

    paddle.x = pointerX - paddle.w / 2;

    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.w > W) {
        paddle.x = W - paddle.w;
    }

    if (state !== "running") {
        resetBall();
        draw();
    }
}

canvas.addEventListener("pointermove", moveToPointer);

// Keyboard controls
document.addEventListener("keydown", function (event) {
    if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
    ) {
        leftPressed = true;
        event.preventDefault();
    }

    if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
    ) {
        rightPressed = true;
        event.preventDefault();
    }

    if (event.code === "Space") {
        event.preventDefault();

        if (state === "ready" || state === "paused") {
            startGame();
        } else if (state === "running") {
            pauseGame();
        }
    }
});

document.addEventListener("keyup", function (event) {
    if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
    ) {
        leftPressed = false;
    }

    if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
    ) {
        rightPressed = false;
    }
});

// Buttons
startBtn.addEventListener("click", startGame);
pauseBtn.addEventListener("click", pauseGame);
restartBtn.addEventListener("click", resetGame);

// Mobile movement buttons
function holdButton(button, direction) {
    button.addEventListener("pointerdown", function (event) {
        event.preventDefault();

        if (direction === "left") leftPressed = true;
        if (direction === "right") rightPressed = true;
    });

    button.addEventListener("pointerup", function () {
        if (direction === "left") leftPressed = false;
        if (direction === "right") rightPressed = false;
    });

    button.addEventListener("pointerleave", function () {
        if (direction === "left") leftPressed = false;
        if (direction === "right") rightPressed = false;
    });

    button.addEventListener("pointercancel", function () {
        if (direction === "left") leftPressed = false;
        if (direction === "right") rightPressed = false;
    });
}

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

holdButton(leftBtn, "left");
holdButton(rightBtn, "right");

// Initialize game
createBricks();
resetBall();
updateStats();
draw();

if (animationId === null) {
    gameLoop();
}

})();
</script>

<div class="controls">
    <button id="leftBtn">◀ LEFT</button>
    <button id="rightBtn">RIGHT ▶</button>
</div>

</body>
</html>
