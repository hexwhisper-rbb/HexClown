
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071321">
<title>Geometry Dash | HEXCLØWN</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 15px;
    background: #071321;
    color: #eaffff;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #00ffc8;
    text-shadow: 0 0 12px #00ffc8;
    margin-bottom: 5px;
}

.subtitle {
    color: #9bbbc8;
    font-size: 13px;
}

.game-box {
    max-width: 540px;
    margin: 20px auto;
    padding: 12px;
    background: #102438;
    border: 1px solid #00d9ff;
    border-radius: 15px;
    box-shadow: 0 0 20px #00d9ff33;
}

.stats {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    color: #00ffc8;
    font-size: 14px;
    font-weight: bold;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #030b14;
    border: 2px solid #00d9ff;
    border-radius: 8px;
    touch-action: none;
}

button {
    padding: 12px 17px;
    margin: 5px 3px;
    border: none;
    border-radius: 8px;
    background: #00d9ff;
    color: #071321;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    background: #00ffc8;
    transform: scale(.97);
}

#startBtn, #jumpBtn {
    background: #00ffc8;
}

#jumpBtn {
    min-width: 130px;
}

.info {
    color: #a9c5d0;
    font-size: 13px;
    line-height: 1.6;
}

.back {
    display: inline-block;
    margin-top: 15px;
    color: #00ffc8;
    text-decoration: none;
    border: 1px solid #00ffc8;
    padding: 10px 18px;
    border-radius: 8px;
}
</style>
</head>

<body>

<h1>GEOMETRY DASH</h1>
<p class="subtitle">HEXCLØWN ARCADE SYSTEM</p>

<div class="game-box">

    <div class="stats">
        <span>SCORE: <span id="score">0</span></span>
        <span>BEST: <span id="best">0</span></span>
        <span>SPEED: <span id="speed">1x</span></span>
    </div>

    <canvas id="game" width="500" height="280"></canvas>

    <div>
        <button id="startBtn">START GAME</button>
        <button id="pauseBtn">PAUSE</button>
        <button id="restartBtn">RESTART</button>
    </div>

    <div>
        <button id="jumpBtn">▲ JUMP</button>
    </div>

    <p class="info">
        Your cube runs automatically.<br>
        Tap the screen or JUMP to clear obstacles.<br>
        You can also press SPACE or the UP arrow.
    </p>

</div>

<a class="back" href="arcandact.html">← BACK TO ARCADE & ACTION</a>

<script>
(function () {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

if (!ctx) {
    document.body.innerHTML = "<h2>Your browser could not start this game.</h2>";
    return;
}

const W = canvas.width;
const H = canvas.height;
const GROUND = 225;

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const speedText = document.getElementById("speed");

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const restartBtn = document.getElementById("restartBtn");
const jumpBtn = document.getElementById("jumpBtn");

let state = "ready";
let score = 0;
let best = 0;
let speed = 4;
let frame = 0;
let lastTime = 0;
let animationId = null;
let spawnTimer = 0;
let groundOffset = 0;
let obstacles = [];
let particles = [];

try {
    best = Number(localStorage.getItem("hexclownGeometryBest")) || 0;
} catch (error) {
    best = 0;
}

bestText.textContent = best;

const cube = {
    x: 75,
    y: GROUND - 32,
    size: 32,
    vy: 0,
    rotation: 0,
    jumping: false
};

function saveBest() {
    if (score > best) {
        best = Math.floor(score);

        try {
            localStorage.setItem(
                "hexclownGeometryBest",
                String(best)
            );
        } catch (error) {
            // Best score still displays during this session.
        }

        bestText.textContent = best;
    }
}

function updateStats() {
    scoreText.textContent = Math.floor(score);
    speedText.textContent = (speed / 4).toFixed(1) + "x";
}

function resetGame() {
    score = 0;
    speed = 4;
    frame = 0;
    spawnTimer = 0;
    groundOffset = 0;

    obstacles = [];
    particles = [];

    cube.y = GROUND - cube.size;
    cube.vy = 0;
    cube.rotation = 0;
    cube.jumping = false;

    state = "ready";
    startBtn.textContent = "START GAME";

    updateStats();
    draw();
}

function startGame() {
    if (state === "gameover" || state === "won") {
        resetGame();
    }

    state = "running";
    startBtn.textContent = "RUNNING";
    lastTime = 0;
    draw();
}

function pauseGame() {
    if (state === "running") {
        state = "paused";
        startBtn.textContent = "RESUME";
    } else if (state === "paused") {
        state = "running";
        startBtn.textContent = "RUNNING";
        lastTime = 0;
    }

    draw();
}

function jump() {
    if (state === "ready") {
        startGame();
    }

    if (state !== "running") return;

    if (!cube.jumping) {
        cube.vy = -11.5;
        cube.jumping = true;
    }
}

function spawnObstacle() {
    const type = Math.random() < 0.25 ? "double" : "spike";

    if (type === "double") {
        obstacles.push({
            type: "double",
            x: W + 20,
            y: GROUND - 34,
            w: 58,
            h: 34
        });
    } else {
        obstacles.push({
            type: "spike",
            x: W + 20,
            y: GROUND - 30,
            w: 30,
            h: 30
        });
    }

    // Occasionally add a block after the main obstacle.
    if (Math.random() < 0.25) {
        obstacles.push({
            type: "block",
            x: W + 125,
            y: GROUND - 35,
            w: 32,
            h: 35
        });
    }
}

function createParticles() {
    for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const force = 1 + Math.random() * 4;

        particles.push({
            x: cube.x + cube.size / 2,
            y: cube.y + cube.size / 2,
            dx: Math.cos(angle) * force,
            dy: Math.sin(angle) * force,
            life: 35,
            size: 3 + Math.random() * 4
        });
    }
}

function updateParticles(dt) {
    particles.forEach(p => {
        p.x += p.dx * dt;
        p.y += p.dy * dt;
        p.dy += 0.1 * dt;
        p.life -= dt;
    });

    particles = particles.filter(p => p.life > 0);
}

function update(delta) {
    const dt = Math.min(delta / 16.67, 2);

    frame += dt;
    score += 0.15 * dt;
    speed = 4 + Math.min(score / 100, 7);

    updateStats();

    // Cube gravity and jumping
    cube.vy += 0.62 * dt;
    cube.y += cube.vy * dt;

    if (cube.y >= GROUND - cube.size) {
        cube.y = GROUND - cube.size;
        cube.vy = 0;
        cube.jumping = false;

        cube.rotation =
            Math.round(cube.rotation / (Math.PI / 2)) *
            (Math.PI / 2);
    } else {
        cube.rotation += 0.09 * dt;
    }

    // Ground movement
    groundOffset += speed * dt;

    if (groundOffset >= 40) {
        groundOffset = 0;
    }

    // Spawn obstacles
    spawnTimer += dt;

    if (spawnTimer > Math.max(48, 85 - speed * 3)) {
        spawnObstacle();
        spawnTimer = 0;
    }

    // Move obstacles
    obstacles.forEach(obstacle => {
        obstacle.x -= speed * dt;
    });

    obstacles = obstacles.filter(o => o.x + o.w > 0);

    updateParticles(dt);
    checkCollision();
}

function checkCollision() {
    const margin = 5;

    const player = {
        x: cube.x + margin,
        y: cube.y + margin,
        w: cube.size - margin * 2,
        h: cube.size - margin * 2
    };

    for (const obstacle of obstacles) {
        let hit = false;

        if (obstacle.type === "spike") {
            // Conservative hitbox for triangular spike.
            const spikeBox = {
                x: obstacle.x + 7,
                y: obstacle.y + 12,
                w: obstacle.w - 14,
                h: obstacle.h - 12
            };

            hit =
                player.x < spikeBox.x + spikeBox.w &&
                player.x + player.w > spikeBox.x &&
                player.y < spikeBox.y + spikeBox.h &&
                player.y + player.h > spikeBox.y;
        } else {
            hit =
                player.x < obstacle.x + obstacle.w &&
                player.x + player.w > obstacle.x &&
                player.y < obstacle.y + obstacle.h &&
                player.y + player.h > obstacle.y;
        }

        if (hit) {
            state = "gameover";
            startBtn.textContent = "PLAY AGAIN";
            createParticles();
            saveBest();
            return;
        }
    }

    // Finish line after reaching the target score.
    if (score >= 1000) {
        state = "won";
        startBtn.textContent = "PLAY AGAIN";
        saveBest();
    }
}

function drawBackground() {
    ctx.fillStyle = "#030b14";
    ctx.fillRect(0, 0, W, H);

    // Neon grid
    ctx.strokeStyle = "#102638";
    ctx.lineWidth = 1;

    for (let x = 0; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, GROUND);
        ctx.stroke();
    }

    for (let y = 0; y < GROUND; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }
}

function drawGround() {
    ctx.fillStyle = "#102438";
    ctx.fillRect(0, GROUND, W, H - GROUND);

    ctx.strokeStyle = "#00ffc8";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    ctx.lineTo(W, GROUND);
    ctx.stroke();

    ctx.fillStyle = "#00d9ff";

    for (let x = -40 + groundOffset; x < W; x += 40) {
        ctx.fillRect(x, GROUND + 16, 20, 3);
    }
}

function drawCube() {
    ctx.save();

    const cx = cube.x + cube.size / 2;
    const cy = cube.y + cube.size / 2;

    ctx.translate(cx, cy);
    ctx.rotate(cube.rotation);

    ctx.fillStyle = "#00ffc8";
    ctx.shadowColor = "#00ffc8";
    ctx.shadowBlur = 16;

    ctx.fillRect(
        -cube.size / 2,
        -cube.size / 2,
        cube.size,
        cube.size
    );

    ctx.shadowBlur = 0;

    // Face
    ctx.fillStyle = "#071321";
    ctx.fillRect(-9, -7, 5, 5);
    ctx.fillRect(5, -7, 5, 5);
    ctx.fillRect(-7, 6, 14, 4);

    ctx.restore();
}

function drawSpike(obstacle) {
    ctx.fillStyle = "#ff4568";
    ctx.shadowColor = "#ff4568";
    ctx.shadowBlur = 12;

    ctx.beginPath();
    ctx.moveTo(obstacle.x, obstacle.y + obstacle.h);
    ctx.lineTo(obstacle.x + obstacle.w / 2, obstacle.y);
    ctx.lineTo(obstacle.x + obstacle.w, obstacle.y + obstacle.h);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
}

function drawBlock(obstacle) {
    ctx.fillStyle = "#a855f7";
    ctx.shadowColor = "#a855f7";
    ctx.shadowBlur = 12;

    ctx.fillRect(
        obstacle.x,
        obstacle.y,
        obstacle.w,
        obstacle.h
    );

    ctx.strokeStyle = "#ffffff";
    ctx.strokeRect(
        obstacle.x + 5,
        obstacle.y + 5,
        obstacle.w - 10,
        obstacle.h - 10
    );

    ctx.shadowBlur = 0;
}

function drawObstacles() {
    obstacles.forEach(obstacle => {
        if (obstacle.type === "spike") {
            drawSpike(obstacle);
        } else if (obstacle.type === "double") {
            drawSpike({
                x: obstacle.x,
                y: obstacle.y,
                w: 29,
                h: obstacle.h
            });

            drawSpike({
                x: obstacle.x + 29,
                y: obstacle.y,
                w: 29,
                h: obstacle.h
            });
        } else {
            drawBlock(obstacle);
        }
    });
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 35);
        ctx.fillStyle = "#00ffc8";
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });

    ctx.globalAlpha = 1;
}

function drawOverlay(title, subtitle) {
    ctx.fillStyle = "rgba(2,9,20,0.84)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";

    ctx.fillStyle = "#00ffc8";
    ctx.font = "bold 29px Arial";
    ctx.fillText(title, W / 2, 105);

    ctx.fillStyle = "#ffffff";
    ctx.font = "14px Arial";
    ctx.fillText(subtitle, W / 2, 140);
}

function draw() {
    drawBackground();
    drawGround();
    drawObstacles();
    drawCube();
    drawParticles();

    if (state === "ready") {
        drawOverlay("GEOMETRY DASH", "Tap START GAME to begin");
    }

    if (state === "paused") {
        drawOverlay("PAUSED", "Tap RESUME to continue");
    }

    if (state === "gameover") {
        drawOverlay("GAME OVER", "Your score: " + Math.floor(score));
    }

    if (state === "won") {
        drawOverlay("LEVEL COMPLETE!", "You reached the finish!");
    }
}

function gameLoop(timestamp) {
    if (state === "running") {
        if (!lastTime) lastTime = timestamp;

        const delta = Math.min(timestamp - lastTime, 100);
        lastTime = timestamp;

        update(delta);
    } else {
        lastTime = timestamp;
    }

    draw();
    animationId = requestAnimationFrame(gameLoop);
}

// Controls
startBtn.addEventListener("click", startGame);
pauseBtn.addEventListener("click", pauseGame);
restartBtn.addEventListener("click", resetGame);

jumpBtn.addEventListener("pointerdown", function (event) {
    event.preventDefault();
    jump();
});

canvas.addEventListener("pointerdown", function (event) {
    event.preventDefault();
    jump();
});

document.addEventListener("keydown", function (event) {
    if (
        event.code === "Space" ||
        event.key === "ArrowUp"
    ) {
        event.preventDefault();
        jump();
    }
});

// Initialize
resetGame();

if (animationId === null) {
    animationId = requestAnimationFrame(gameLoop);
}

})();
</script>

</body>
  </html>
